name: MSFS 2024 Livery Tools Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and Zip
        # Unter Windows nutzt man gradlew.bat
        run: ./gradlew.bat zipDesktopDistributable

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/msfs2024tools_*.zip
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
