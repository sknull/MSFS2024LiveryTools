name: Msfs2024Tools

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
      packages: write

    steps:
      - name: Checkout Msfs2024Tools
        uses: actions/checkout@v4
        with:
          path: MSFS2024LiveryTools

      - name: Checkout Stephans-KMP-Components
        uses: actions/checkout@v4
        with:
          repository: sknull/Stephans-KMP-Components
          path: Stephans-KMP-Components
#          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.Gradle_Encryption_Key }}

      - name: Run Tests
        working-directory: MSFS2024LiveryTools
        shell: bash
        env:
          GITHUB_ACTOR: sknull
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"
        run: |
          chmod +x gradlew
          ./gradlew test jvmTest --no-configuration-cache

      - name: Build Binaries Only
        working-directory: MSFS2024LiveryTools
        env:
          GITHUB_ACTOR: sknull
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew packageReleaseMsi -x test --no-configuration-cache --no-daemon

      - name: Upload Intermediates
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ matrix.os }}
          path: |
            MSFS2024LiveryTools/composeApp/build/compose/binaries/
            MSFS2024LiveryTools/composeApp/build/distributions/
            MSFS2024LiveryTools/composeApp/build/asciidoc/
          include-hidden-files: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Msfs2024Tools
        uses: actions/checkout@v4
        with:
          path: MSFS2024LiveryTools

      - name: Checkout Stephans-KMP-Components
        uses: actions/checkout@v4
        with:
          repository: sknull/Stephans-KMP-Components
          path: Stephans-KMP-Components
#          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.Gradle_Encryption_Key }}

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: MSFS2024LiveryTools
          merge-multiple: true

      - name: Final Publish to GitHub Packages
        working-directory: MSFS2024LiveryTools
        env:
          GITHUB_ACTOR: sknull
        run: |
          chmod +x gradlew
          ./gradlew publishBinaryReleasePublicationToGitHubPackagesRepository --no-configuration-cache
