name: MSFS 2024 Livery Tools Publish

on:
  push:
    branches:
      - main
      - develop
jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      issues: write
      packages: write

    steps:
      - name: Checkout Msfs2024Tools
        uses: actions/checkout@v4
        with:
          path: MSFS2024LiveryTools

      - name: Checkout Stephans-KMP-Components
        uses: actions/checkout@v4
        with:
          repository: sknull/Stephans-KMP-Components
          path: Stephans-KMP-Components
#          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-encryption-key: ${{ secrets.Gradle_Encryption_Key }}

      - name: Build and zip package
        working-directory: MSFS2024LiveryTools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew zip
