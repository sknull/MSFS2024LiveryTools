[versions]
version-proguardGradle = "7.8.2"
version-skikoAwtRuntimeWindowsX64 = "0.9.47"
version-uiToolingPreview = "1.10.0"
version-kotlin = "2.3.10"
version-jetbrains-kotlin = "1.10.2"
version-kotlin-xml-util = "1.0.0-rc2"
version-gradle-pdf = "4.0.2"

version-material3 = "1.9.0"
version-navigation-compose = "2.9.2"

version-coil3 = "3.4.0"
version-deskit = "1.4.1"
version-koin = "4.1.1"
version-ktor = "3.4.1"
version-flatlaf = "3.7"

version-kermit = "2.1.0"

version-junit = "6.0.3"

version-androidx-activityCompose = "1.12.4"
version-androidx-lifecycle = "2.9.6"
version-androidGradlePlugin = "8.12.3"
version-html-converter = "1.1.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "version-kotlin" }
kotlin-xml-util = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "version-kotlin-xml-util" }
kotlin-xml-serialization = { module = "io.github.pdvrieze.xmlutil:serialization", version.ref = "version-kotlin-xml-util" }
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "version-jetbrains-kotlin" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "version-androidx-activityCompose" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "version-androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "version-androidx-lifecycle" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "version-coil3" }
coil-mp = { module = "io.coil-kt.coil3:coil", version.ref = "version-coil3" }
coil-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "version-coil3" }
coil-network-ktor2 = { module = "io.coil-kt.coil3:coil-network-ktor2", version.ref = "version-coil3" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "version-coil3" }

compose-components = { module = "org.jetbrains.compose.components:components-resources", version.ref = "version-jetbrains-kotlin" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "version-jetbrains-kotlin" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "version-material3" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "version-jetbrains-kotlin" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "version-jetbrains-kotlin" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "version-jetbrains-kotlin" }

deskit = { module = "com.github.zahid4kh:deskit", version.ref = "version-deskit" }

jetbrains-compose-navigation = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref= "version-navigation-compose" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "version-junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "version-junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "version-junit" }

kermit = { module = "co.touchlab:kermit", version.ref = "version-kermit" }

koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "version-koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "version-koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "version-koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "version-koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "version-koin" }

flatlaf = { module = "com.formdev:flatlaf", version.ref = "version-flatlaf" }

ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "version-ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "version-ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "version-ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "version-ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "version-ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "version-ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "version-ktor" }
proguardGradle = { module = "com.guardsquare:proguard-gradle", version.ref = "version-proguardGradle" }
skiko-awt-runtime-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-x64", version.ref = "version-skikoAwtRuntimeWindowsX64" }
html-converter = { module = "be.digitalia.compose.htmlconverter:htmlconverter", version.ref="version-html-converter"}

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "version-kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "version-kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "version-kotlin" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "version-jetbrains-kotlin" }
gradle-pdf = { id = "org.asciidoctor.jvm.pdf", version.ref = "version-gradle-pdf" }

[bundles]
compose = [
    "compose-components",
    "compose-foundation",
    "compose-material3",
    "compose-runtime",
    "compose-ui",
    "compose-ui-tooling"
]
koin = [
    "koin-compose",
    "koin-compose-viewmodel",
    "koin-core"
]
ktor = [
    "ktor-client-auth",
    "ktor-client-content-negotiation",
    "ktor-client-core",
    "ktor-client-logging",
    "ktor-client-okhttp",
    "ktor-serialization-kotlinx-json"
]
coil = [
    "coil-compose",
    "coil-mp",
    "coil-network",
    "coil-network-ktor2",
    "coil-network-ktor3"
]
